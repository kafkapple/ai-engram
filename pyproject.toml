[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-engram"
version = "0.8.0"
description = "Minimal, efficient covariance-based engram extraction for editing HuggingFace LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jea Kwon" }]
keywords = ["model-editing", "unlearning", "llm", "engram", "covariance", "pytorch", "transformers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = ["mkdocs-material", "mkdocstrings[python]", "black"]
audit = ["datasets", "matplotlib", "numpy", "scikit-learn", "rouge_score"]

# Audit environment pins (uv). Versions mirror the gpu03 env that produced
# experiments/unlearning_audit/results (environment.gpu03.yml, python 3.11.15).
# torch: gpu03 used the PyPI cu130 build; Olaf driver 570 caps at CUDA 12.8, so the
# same version is taken from the cu129 index (CUDA 12 minor-version compatibility).
# Library users are unaffected: these only apply to `uv lock`/`uv sync` here.
[tool.uv]
environments = ["python_version >= '3.11'"]
constraint-dependencies = [
    "torch==2.12.1",
    "transformers==5.13.0",
    "datasets==5.0.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "rouge_score==0.1.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.urls]
Homepage = "https://github.com/jeakwon/ai-engram"
Repository = "https://github.com/jeakwon/ai-engram"

# Distribution name is `ai-engram`; the import package is `engram` (src layout).
[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

# Keep the sdist lean: ship source + tests + metadata, not the large example notebooks.
[tool.hatch.build.targets.sdist]
include = [
    "src/engram",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
